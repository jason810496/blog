<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1010" width="2000" height="1010" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang TC', sans-serif">
<style>
 text { fill: #1f2328; }
 .h1 { font-size: 40px; font-weight: 750; }
 .h2 { font-size: 22px; fill: #5f6672; }
 .when { font-size: 21px; font-weight: 600; fill: #ffffff; }
 .title { font-size: 34px; font-weight: 750; }
 .tools { font-size: 21px; fill: #5f6672; }
 .row { font-size: 18px; font-weight: 700; letter-spacing: 1.5px; }
 .body { font-size: 23px; }
 .axis { font-size: 22px; font-weight: 650; }
 .tick { font-size: 21px; fill: #5f6672; }
</style>
<rect width="2000" height="1010" rx="18" fill="#fbfaf7"/>
<text x="70" y="60" class="h1">How I work with AI coding tools, stage by stage</text>
<text x="70" y="96" class="h2">What I tell the AI keeps moving up a level, while judgment stays with me</text>
<rect x="70" y="140" width="590" height="715" rx="16" fill="#ffffff" stroke="#4b5563" stroke-width="2"/>
<rect x="100" y="176" width="252" height="38" rx="19" fill="#4b5563"/>
<text x="226" y="202" text-anchor="middle" class="when">Oct 2024 · first PRs</text>
<text x="100" y="262" class="title">1. Inline completion</text>
<text x="100" y="296" class="tools">GitHub Copilot</text>
<line x1="100" y1="347" x2="630" y2="347" stroke="#e4dfd4" stroke-width="1.5"/>
<text x="100" y="383" class="row" fill="#2f3fb0" style="fill:#2f3fb0">I DESCRIBE</text>
<text x="100" y="421" class="body">Nothing. I find the module and</text>
<text x="100" y="454" class="body">function, then start typing</text>
<line x1="100" y1="527" x2="630" y2="527" stroke="#e4dfd4" stroke-width="1.5"/>
<text x="100" y="563" class="row" fill="#4b5563" style="fill:#4b5563">AI DOES</text>
<text x="100" y="601" class="body">Completes the current</text>
<text x="100" y="634" class="body">word or line</text>
<line x1="100" y1="692" x2="630" y2="692" stroke="#e4dfd4" stroke-width="1.5"/>
<text x="100" y="728" class="row" fill="#2f3fb0" style="fill:#2f3fb0">I STILL OWN</text>
<text x="100" y="766" class="body">Reading every module end to end,</text>
<text x="100" y="799" class="body">most of the code, unit tests,</text>
<text x="100" y="832" class="body">design patterns and interfaces</text>
<path d="M666,481.5 L698,497.5 L666,513.5 Z" fill="#5f6672"/>
<rect x="705" y="140" width="590" height="715" rx="16" fill="#ffffff" stroke="#4b5563" stroke-width="2"/>
<rect x="735" y="176" width="206" height="38" rx="19" fill="#4b5563"/>
<text x="838" y="202" text-anchor="middle" class="when">Up to early 2026</text>
<text x="735" y="262" class="title">2. Multi-file editing</text>
<text x="735" y="296" class="tools">Copilot multi-line &amp; edits · Cursor</text>
<line x1="735" y1="347" x2="1265" y2="347" stroke="#e4dfd4" stroke-width="1.5"/>
<text x="735" y="383" class="row" fill="#2f3fb0" style="fill:#2f3fb0">I DESCRIBE</text>
<text x="735" y="421" class="body">Which files and functions</text>
<text x="735" y="454" class="body">to change, and how</text>
<line x1="735" y1="527" x2="1265" y2="527" stroke="#e4dfd4" stroke-width="1.5"/>
<text x="735" y="563" class="row" fill="#4b5563" style="fill:#4b5563">AI DOES</text>
<text x="735" y="601" class="body">Multi-line suggestions and</text>
<text x="735" y="634" class="body">edits across several files</text>
<line x1="735" y1="692" x2="1265" y2="692" stroke="#e4dfd4" stroke-width="1.5"/>
<text x="735" y="728" class="row" fill="#2f3fb0" style="fill:#2f3fb0">I STILL OWN</text>
<text x="735" y="766" class="body">Locating the change in the</text>
<text x="735" y="799" class="body">codebase, reviewing every edit</text>
<path d="M1301,481.5 L1333,497.5 L1301,513.5 Z" fill="#5f6672"/>
<rect x="1340" y="140" width="590" height="715" rx="16" fill="#ffffff" stroke="#c15f3c" stroke-width="3.5"/>
<rect x="1370" y="176" width="183" height="38" rx="19" fill="#c15f3c"/>
<text x="1462" y="202" text-anchor="middle" class="when">Apr 2026 → now</text>
<text x="1370" y="262" class="title">3. Agent collaboration</text>
<text x="1370" y="296" class="tools">Claude Code · Opus 5.5 / Fable</text>
<line x1="1370" y1="347" x2="1900" y2="347" stroke="#e4dfd4" stroke-width="1.5"/>
<text x="1370" y="383" class="row" fill="#2f3fb0" style="fill:#2f3fb0">I DESCRIBE</text>
<text x="1370" y="421" class="body">Intent in the right domain: control</text>
<text x="1370" y="454" class="body">vs data plane, module boundaries,</text>
<text x="1370" y="487" class="body">rough control flow</text>
<line x1="1370" y1="527" x2="1900" y2="527" stroke="#e4dfd4" stroke-width="1.5"/>
<text x="1370" y="563" class="row" fill="#c15f3c" style="fill:#c15f3c">AI DOES</text>
<text x="1370" y="601" class="body">70-80% of a feature end to end,</text>
<text x="1370" y="634" class="body">dependency / rebase conflicts,</text>
<text x="1370" y="667" class="body">fixing CI</text>
<line x1="1370" y1="692" x2="1900" y2="692" stroke="#e4dfd4" stroke-width="1.5"/>
<text x="1370" y="728" class="row" fill="#2f3fb0" style="fill:#2f3fb0">I STILL OWN</text>
<text x="1370" y="766" class="body">Judgment: architecture, interface</text>
<text x="1370" y="799" class="body">design, reviewing large features</text>
<line x1="70" y1="930" x2="1930" y2="930" stroke="#1f2328" stroke-width="3"/>
<path d="M1930,920 L1952,930 L1930,940 Z" fill="#1f2328"/>
<text x="70" y="912" class="axis">Level of what I tell the AI</text>
<circle cx="365" cy="930" r="8" fill="#4b5563"/>
<text x="365" y="968" text-anchor="middle" class="tick">line</text>
<circle cx="1000" cy="930" r="8" fill="#4b5563"/>
<text x="1000" y="968" text-anchor="middle" class="tick">file &amp; function</text>
<circle cx="1635" cy="930" r="8" fill="#c15f3c"/>
<text x="1635" y="968" text-anchor="middle" class="tick">intent &amp; boundaries</text>
</svg>